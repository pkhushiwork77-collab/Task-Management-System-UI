<div class="form-container">
    <div class="form-card">
        <h1 class="form-title">Create New Task</h1>

        <form class="form-grid" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="title" class="form-label">Task Title</label>
                <input
                    type="text"
                    formControlName="title"
                    id="title"
                    placeholder="Enter Task Title"
                    class="form-input"
                >
            </div>

            <div *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.invalid" class="error-message">
                <small *ngIf="taskForm.get('title')?.errors?.['required']">
                    Title is required
                </small>
                <small *ngIf="taskForm.get('title')?.errors?.['minlength']">
                    Title must be at least 3 characters long
                </small>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea
                    formControlName="description"
                    id="description"
                    rows="5"
                    placeholder="Enter Task Description"
                    class="form-textarea"
                ></textarea>
            </div>
            <div class="form-actions form-group">
                <button type="submit" class="btn-submit" [disabled]="taskForm.invalid">
                    <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Add Task
                </button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>
        </form>
    </div>
</div>
