<div class="text-end mr-3 mb-6">
    <button 
        class="bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-3 px-6 rounded-xl transition duration-200 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 cursor-pointer inline-flex items-center justify-center gap-2"
        (click)="onAddTask()"
    >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Add Task
    </button>
</div>

<div class="task-card">
  <div class="header-section">
    <h1>Task List</h1>
    <div class="filter-controls">
      <div class="search-container">
        <input type="text" name="search" id="search" placeholder="Search tasks..." class="search-input" [(ngModel)]="searchTerm" (input)="onSearch()">
      </div>
      <div class="dropdown-container">
        <select name="status" id="status" [(ngModel)]="selectedStatus" (change)="onSearch()" class="dropdown">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
          <option value="in-progress">In-Progress</option>
        </select>
      </div>
    </div>
  </div>

  <div class="task-list">
    <div *ngFor="let task of tasks" class="task-item">
      <div class="flex justify-between items-center gap-4">
        <div (click)="viewTaskDetails(task.id)" class="cursor-pointer">
          <div class="task-item-title">{{ task.title }}</div>
          <div class="task-item-status">{{ task.status }}</div>
        </div>
        <div class="task-actions">
          <button class="btn-toggle cursor-pointer" (click)="toggleTaskStatus(task.id)">Toggle</button>
          <button class="btn-delete cursor-pointer" (click)="deleteTask(task.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
